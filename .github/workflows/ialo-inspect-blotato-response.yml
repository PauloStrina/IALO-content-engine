name: IALO Inspect Blotato Response

on:
  pull_request:
    types: [synchronize]
    paths:
      - "content/campaigns/2026-07-14-eight-weeks/.inspect-blotato"

permissions:
  contents: write
  actions: read

jobs:
  inspect:
    if: ${{ github.event.pull_request.head.ref == 'feature/word-16-carousel-campaign' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/word-16-carousel-campaign

      - name: Download failed production response
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf /tmp/blotato-response
          mkdir -p /tmp/blotato-response
          gh run download 29164888966 \
            --repo "${{ github.repository }}" \
            --name ialo-16-carousel-campaign-production-response \
            --dir /tmp/blotato-response
          find /tmp/blotato-response -type f -maxdepth 5 -print

      - name: Save diagnostic response in branch
        run: |
          mkdir -p diagnostics
          RESPONSE_FILE="$(find /tmp/blotato-response -name blotato-response.json -type f | head -n 1)"
          test -n "$RESPONSE_FILE"
          cp "$RESPONSE_FILE" diagnostics/blotato-response-29164888966.json
          node - <<'NODE'
          const fs = require('fs');
          const input = JSON.parse(fs.readFileSync('diagnostics/blotato-response-29164888966.json', 'utf8'));
          const summary = {
            sent: input.sent,
            failed: input.failed,
            runId: input.runId,
            errors: [...new Set((input.results || []).filter((r) => r.status === 'failed').map((r) => r.error))]
          };
          fs.writeFileSync('diagnostics/blotato-response-29164888966-summary.json', JSON.stringify(summary, null, 2) + '\n');
          console.log(JSON.stringify(summary, null, 2));
          NODE

      - name: Commit diagnostic files
        run: |
          git config user.name "ialo-content-engine"
          git config user.email "actions@users.noreply.github.com"
          git add diagnostics/blotato-response-29164888966.json diagnostics/blotato-response-29164888966-summary.json
          git commit -m "Record Blotato production response diagnostics" || exit 0
          git push origin HEAD:feature/word-16-carousel-campaign

name: Render IALO V03 Assets Free

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - ialo-v03-assets-free
    paths:
      - 'templates/01_acceptance_inner_dialogue/v03/**'
      - '.github/workflows/render-ialo-v03-assets-free.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Render carousel PNGs
        run: node templates/01_acceptance_inner_dialogue/v03/render-assets-free.mjs

      - name: Zip output
        run: |
          cd dist
          zip -r ialo_acceptance_test_v03_assets_free_pngs.zip ialo_acceptance_test_v03_assets_free

      - name: Commit rendered output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/ialo_acceptance_test_v03_assets_free dist/ialo_acceptance_test_v03_assets_free_pngs.zip
          git commit -m "Render IALO V03 assets-free PNG outputs" || echo "No rendered changes to commit"
          git push

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ialo_acceptance_test_v03_assets_free_pngs
          path: dist/ialo_acceptance_test_v03_assets_free_pngs.zip

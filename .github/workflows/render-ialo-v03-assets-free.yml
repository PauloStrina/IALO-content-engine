name: Render IALO V03 Real Assets

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - ialo-v03-assets-free
    paths:
      - 'templates/01_acceptance_inner_dialogue/v03/**'
      - 'assets/ialo/**'
      - '.github/workflows/render-ialo-v03-assets-free.yml'

permissions:
  contents: read

concurrency:
  group: render-ialo-v03-real-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Render carousel PNGs
        run: node templates/01_acceptance_inner_dialogue/v03/render-real-assets.mjs

      - name: Zip output
        run: |
          cd dist
          zip -r ialo_acceptance_test_v03_real_assets_pngs.zip ialo_acceptance_test_v03_real_assets

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ialo_acceptance_test_v03_real_assets_pngs
          path: dist/ialo_acceptance_test_v03_real_assets_pngs.zip

name: Weekly IALO Content

on:
  workflow_dispatch:
    inputs:
      thesis:
        description: "Tesis semanal"
        required: true
        type: choice
        options:
          - cambio-adentro
          - segui-tu-entusiasmo
          - acepto-lo-que-es
          - cultura-inconsciente
      template_key:
        description: "Template visual"
        required: true
        default: carousel-base
        type: string

jobs:
  generate-and-render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate weekly plan
        run: npm run generate:weekly-plan
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          THESIS: ${{ inputs.thesis }}

      - name: Generate carousel copy
        run: npm run generate:carousel
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          THESIS: ${{ inputs.thesis }}

      - name: Render carousel
        run: npm run render:carousel
        env:
          TEMPLATE_KEY: ${{ inputs.template_key }}

      - name: Upload generated assets
        uses: actions/upload-artifact@v4
        with:
          name: ialo-content-output
          path: output/
